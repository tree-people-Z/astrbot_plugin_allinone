name: astrbot_plugin_allinone
display_name: 聚合助手 AllInOne
short_desc: 签到抽老婆 + 点歌 + 戳一戳 + QQ群管，深度融合 LLM
desc: >-
  一站式聚合插件：每日签到（吉凶运势/积分/连签）、每日老婆（多图源）、多音源点歌、
  戳一戳、QQ 群管。全平台可用，QQ 专属功能自动降级；深度对接 LLM 函数调用，
  可用自然语言触发签到、点歌、戳人、群管理等操作。
version: v1.0.0
author: tree-people-Z
repo: https://github.com/tree-people-Z/astrbot_plugin_allinone
